<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>半獸人法師連續動作預覽</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#4b1313,#120709 68%);color:#fff;font-family:system-ui,sans-serif}.preview{width:min(90vw,620px);text-align:center}.stage{position:relative;width:100%;aspect-ratio:520/660;overflow:visible}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.status{margin:.7rem 0 0;color:#ffc6ad;font-size:.95rem}
  </style>
</head>
<body>
  <main class="preview">
    <div class="stage"><img id="actor" alt="半獸人法師連續施法動作"></div>
    <p class="status">2.5 秒循環・1 → 2 → 3 → 4 → 5 → 4 → 3 → 2</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/orc-mage-fire-cast-five-frame-aligned-v2/';
    const frames = [1, 2, 3, 4, 5].map((frame) => `${base}frame-${String(frame).padStart(2, '0')}.png?v=1`);
    const order = [0, 1, 2, 3, 4, 3, 2, 1];
    const frameDurationMs = 2500 / order.length;
    frames.forEach((source) => { const image = new Image(); image.src = source; });
    const actor = document.querySelector('#actor');
    let step = 0;
    const render = () => { actor.src = frames[order[step]]; };
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setInterval(() => { step = (step + 1) % order.length; render(); }, frameDurationMs);
    }
  </script>
</body>
</html>
