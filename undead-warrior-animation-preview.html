<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>不死族戰士動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #40305b 0, #21162f 48%, #0e0915 100%); color: #fbf4ff; }
    main { width: min(94vw, 780px); text-align: center; }
    .stage { height: min(78vh, 780px); display: grid; place-items: center; overflow: visible; border: 1px solid #c895ff55; border-radius: 22px; background: #130b1eaa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #a04dff1c; }
    img { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; }
    .status { margin: .7rem 0 0; color: #dcc7ee; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="不死族戰士五幀動畫預覽"><img id="preview" alt="不死族戰士動畫" /></section>
    <p class="status">單次播放 2.5 秒・1 → 2 → 3 → 4 → 5</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/undead-warrior-five-frame/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png', 'frame-05.png'];
    const order = [0, 1, 2, 3, 4];
    const frameDurationMs = 500;
    const preview = document.querySelector('#preview');
    let orderIndex = 0;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function render() { preview.src = base + frames[order[orderIndex]]; }
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const timer = setInterval(() => {
        if (orderIndex < order.length - 1) { orderIndex += 1; render(); return; }
        clearInterval(timer);
      }, frameDurationMs);
    }
  </script>
</body>
</html>
