<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精靈戰士角色選擇動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #193c69 0, #0b1d38 48%, #050b17 100%); color: #eef6ff; }
    main { width: min(94vw, 820px); text-align: center; }
    .stage { height: min(78vh, 760px); display: grid; place-items: center; overflow: visible; border: 1px solid #559cff55; border-radius: 22px; background: #071426aa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #287cff1c; }
    img { display: block; width: min(100%, 588px); height: min(100%, 733px); min-width: 0; min-height: 0; object-fit: contain; image-rendering: auto; }
    .status { margin: .7rem 0 0; color: #bddcff; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="精靈戰士角色選擇四幀動畫預覽"><img id="preview" alt="精靈戰士角色選擇連續動作" /></section>
    <p class="status">單次播放 1.8 秒・1 → 2 → 3 → 4</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/elf-warrior-selection-four-frame-v1/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png'];
    const frameDurationMs = 1800 / frames.length;
    const preview = document.querySelector('#preview');
    let index = 0;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function render() { preview.src = base + frames[index]; }
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const timer = setInterval(() => {
        if (index < frames.length - 1) { index += 1; render(); return; }
        clearInterval(timer);
      }, frameDurationMs);
    }
  </script>
</body>
</html>
