<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>亡靈法師連續動作預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, #30233d 0%, #15101d 72%);
    }
    main { display: grid; justify-items: center; gap: 14px; }
    .stage {
      width: min(88vw, 720px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      overflow: visible;
    }
    img { width: 100%; height: 100%; object-fit: contain; }
    p { margin: 0; color: #ddd4e8; }
  </style>
</head>
<body>
  <main>
    <div class="stage"><img id="actor" alt="亡靈法師施法連續動畫"></div>
    <p>5 幀往返播放・完整循環 2.5 秒</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/undead-mage-five-frame-v1/';
    const frames = [1, 2, 3, 4, 5].map(number => `${base}frame-${String(number).padStart(2, '0')}.png`);
    const order = [0, 1, 2, 3, 4, 3, 2, 1];
    const stepMs = 2500 / order.length;
    frames.forEach(source => { const image = new Image(); image.src = source; });
    const actor = document.querySelector('#actor');
    let step = 0;
    actor.src = frames[order[step]];
    setInterval(() => {
      step = (step + 1) % order.length;
      actor.src = frames[order[step]];
    }, stepMs);
  </script>
</body>
</html>
