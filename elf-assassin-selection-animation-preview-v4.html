<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精靈盜賊五幀連續動作預覽 V4</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #263d68 0, #111c38 48%, #070b18 100%); color: #f5efff; }
    main { width: min(94vw, 820px); text-align: center; }
    .stage { height: min(78vh, 760px); display: grid; place-items: center; overflow: visible; border: 1px solid #806cff55; border-radius: 22px; background: #0a1026aa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #5940ff1c; }
    img { display: block; width: min(100%, 594px); height: min(100%, 760px); object-fit: contain; image-rendering: auto; }
    .status { margin: .7rem 0 0; color: #cec5ff; font-size: .95rem; }
    button { margin-top: .8rem; padding: .65rem 1.2rem; border: 1px solid #9f8cff; border-radius: 999px; color: #fff; background: #6d55d8; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="精靈盜賊五幀連續動作預覽"><img id="preview" alt="精靈盜賊連續動作" /></section>
    <p class="status">單次播放 2 秒・1 → 2 → 3 → 4 → 5・角色視覺大小與腳底已對齊</p>
    <button id="replay" type="button">重新播放</button>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/elf-assassin-selection-five-frame-v4/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png', 'frame-05.png'];
    const frameDurationMs = 400;
    const preview = document.querySelector('#preview');
    let timer = null;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function play() {
      clearInterval(timer);
      let index = 0;
      preview.src = base + frames[index];
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      timer = setInterval(() => {
        if (index >= frames.length - 1) { clearInterval(timer); return; }
        index += 1;
        preview.src = base + frames[index];
      }, frameDurationMs);
    }
    document.querySelector('#replay').addEventListener('click', play);
    play();
  </script>
</body>
</html>
