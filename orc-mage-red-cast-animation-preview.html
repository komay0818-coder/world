<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>獸人法師紅焰施法動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #55261d 0, #26100d 48%, #100707 100%); color: #fff4ed; }
    main { width: min(94vw, 820px); text-align: center; }
    .stage { height: min(78vh, 760px); display: grid; place-items: center; overflow: visible; border: 1px solid #ff9d6c55; border-radius: 22px; background: #170a08aa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #ff56251c; }
    img { display: block; width: min(100%, 539px); height: min(100%, 712px); min-width: 0; min-height: 0; object-fit: contain; image-rendering: auto; }
    .status { margin: .7rem 0 0; color: #f4c6af; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="獸人法師紅焰五幀動畫預覽"><img id="preview" alt="獸人法師紅焰施法動畫" /></section>
    <p class="status">單次播放 2.5 秒・1 → 2 → 3 → 4 → 5</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/orc-mage-red-cast-five-frame-v1/hq/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png', 'frame-05.png'];
    const frameDurationMs = 500;
    const preview = document.querySelector('#preview');
    let index = 0;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function render() { preview.src = base + frames[index]; }
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const timer = setInterval(() => {
        if (index < frames.length - 1) { index += 1; render(); return; }
        clearInterval(timer);
      }, frameDurationMs);
    }
  </script>
</body>
</html>
