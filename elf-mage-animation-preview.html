<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精靈法師動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #243f70 0, #121b38 48%, #070b18 100%); color: #eef8ff; }
    main { width: min(94vw, 780px); text-align: center; }
    .stage { height: min(78vh, 780px); display: grid; place-items: center; overflow: visible; border: 1px solid #81ccff55; border-radius: 22px; background: #071020aa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #399fff1c; }
    img { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; }
    footer { display: flex; justify-content: center; gap: 12px; align-items: center; padding-top: 14px; }
    button { border: 1px solid #9bd7ff77; border-radius: 999px; padding: 8px 18px; background: #24456d; color: inherit; cursor: pointer; }
    output { min-width: 92px; color: #bbdcf5; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="精靈法師五幀動畫預覽"><img id="preview" alt="精靈法師動畫" /></section>
    <footer><button id="toggle" type="button">暫停</button><output id="status">第 1 / 5 幀</output></footer>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/elf-mage-five-frame-v3/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png', 'frame-05.png'];
    const order = [0, 1, 2, 3, 4, 3, 2, 1];
    const frameDurationMs = 312.5;
    const preview = document.querySelector('#preview');
    const toggle = document.querySelector('#toggle');
    const status = document.querySelector('#status');
    let orderIndex = 0;
    let timer = null;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function render() { const frameIndex = order[orderIndex]; preview.src = base + frames[frameIndex]; status.value = `第 ${frameIndex + 1} / 5 幀`; }
    function play() { clearInterval(timer); timer = setInterval(() => { orderIndex = (orderIndex + 1) % order.length; render(); }, frameDurationMs); toggle.textContent = '暫停'; }
    toggle.addEventListener('click', () => { if (timer) { clearInterval(timer); timer = null; toggle.textContent = '播放'; } else play(); });
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) play(); else toggle.textContent = '播放';
  </script>
</body>
</html>
