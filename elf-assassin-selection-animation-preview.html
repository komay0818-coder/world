<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精靈盜賊角色選擇動畫預覽</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #263d68 0, #111c38 48%, #070b18 100%); color: #f5efff; }
    main { width: min(94vw, 820px); text-align: center; }
    .stage { height: min(78vh, 760px); display: grid; place-items: center; overflow: visible; border: 1px solid #806cff55; border-radius: 22px; background: #0a1026aa; box-shadow: 0 24px 70px #0009, inset 0 0 70px #5940ff1c; }
    img { display: block; width: min(100%, 390px); height: min(100%, 660px); min-width: 0; min-height: 0; object-fit: contain; image-rendering: auto; }
    .status { margin: .7rem 0 0; color: #cec5ff; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="精靈盜賊角色選擇五幀動畫預覽"><img id="preview" alt="精靈盜賊角色選擇連續動作" /></section>
    <p class="status">單次播放 2 秒・1 → 2 → 3 → 4 → 5</p>
  </main>
  <script>
    const base = 'assets/character-portraits/calibration-tests/elf-assassin-selection-five-frame-v6-aligned/';
    const frames = ['frame-01.png', 'frame-02.png', 'frame-03.png', 'frame-04.png', 'frame-05.png'];
    const frameDurationMs = 2000 / frames.length;
    const preview = document.querySelector('#preview');
    let index = 0;
    frames.forEach((filename) => { const image = new Image(); image.src = base + filename; });
    function render() { preview.src = base + frames[index]; }
    render();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const timer = setInterval(() => {
        if (index < frames.length - 1) { index += 1; render(); return; }
        clearInterval(timer);
      }, frameDurationMs);
    }
  </script>
</body>
</html>
